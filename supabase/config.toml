# Supabase CLI configuration for local development.
# Start the local stack with `npm run db:start`. Migrations in supabase/migrations are applied
# on `npm run db:reset`, and supabase/seed.sql runs after them.

project_id = "personal-accounting-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Keep in step with the Postgres version used by the CI database job (see .github/workflows/ci.yml).
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local development signs in immediately. Enable confirmations for hosted projects.
enable_confirmations = false
